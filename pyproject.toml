[project]
name = "freyja"
version = "0.1.0"
description = "VM management utility tool"
authors = [
    { name = "Louis Cailliot", email = "louis.cailliot@thalesgroup.com" }
]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "typer>=0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
]


[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "freyja" #points to the freyja/freyja/ folder
module-root = "."

[project.scripts]
freyja = "freyja.__main__:main"
